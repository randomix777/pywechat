[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "order-agent"
version = "0.1.0"
description = "Order domain plugin for business_agent: intents, output contract, auto-recording policy, receipts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-2.1" }
keywords = ["orders", "agent", "plugin", "retail"]
dependencies = ["business-agent>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
